<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/favicon.ico?v=2" type="image/x-icon">
    <title>Calendar | Student Productivity</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex h-screen overflow-hidden bg-slate-100 text-slate-900 max-[620px]:flex-col max-[620px]:h-auto max-[620px]:overflow-auto">
<aside class="sticky top-0 flex h-screen w-[250px] shrink-0 flex-col gap-[30px] overflow-hidden border-r border-[#dfe2e9] bg-[#fafbfe] px-5 py-8 max-[900px]:w-[210px] max-[900px]:px-3 max-[900px]:py-7 max-[620px]:static max-[620px]:h-auto max-[620px]:w-full max-[620px]:gap-[18px] max-[620px]:border-b max-[620px]:border-r-0 max-[620px]:p-4">
    <a class="flex items-center gap-3 px-2 text-[1.15rem] font-bold max-[620px]:p-0" href="index.html"><span class="grid h-[42px] w-[42px] place-items-center rounded-md bg-[#4c7ff3] text-[1.5rem] text-white max-[620px]:h-[34px] max-[620px]:w-[34px] max-[620px]:text-[1.1rem]" aria-hidden="true">S</span><span>Student<span class="block text-[.67rem] font-medium text-[#8b91a0] max-[620px]:ml-[5px] max-[620px]:inline max-[620px]:text-base">Productivity</span></span></a>
    <p class="px-4 pt-2 text-xs tracking-[.02em] text-[#66738c] max-[620px]:hidden">WORKSPACE</p>
    <nav class="-mt-4 grid gap-2 max-[620px]:m-0 max-[620px]:flex max-[620px]:flex-wrap max-[620px]:justify-between max-[620px]:gap-1" aria-label="Main navigation">
        <a class="flex items-center rounded-[5px] px-4 py-3 text-[.95rem] text-[#58657b] hover:bg-[#f4f5fc] max-[620px]:min-h-11 max-[620px]:px-2 max-[620px]:py-2 max-[620px]:text-xs" href="index.html">Dashboard</a>
        <a class="flex items-center rounded-[5px] px-4 py-3 text-[.95rem] text-[#58657b] hover:bg-[#f4f5fc] max-[620px]:min-h-11 max-[620px]:px-2 max-[620px]:py-2 max-[620px]:text-xs" href="tasks.html">Tasks</a>
        <a class="flex items-center rounded-[5px] bg-[#eeefff] px-4 py-3 text-[.95rem] font-semibold text-[#424bc1] hover:bg-[#f4f5fc] max-[620px]:min-h-11 max-[620px]:px-2 max-[620px]:py-2 max-[620px]:text-xs" aria-current="page" href="calendar.html">Calendar</a>
        <a class="flex items-center rounded-[5px] px-4 py-3 text-[.95rem] text-[#58657b] hover:bg-[#f4f5fc] max-[620px]:min-h-11 max-[620px]:px-2 max-[620px]:py-2 max-[620px]:text-xs" href="notes.html">Notes</a>
    </nav>
    <div class="mt-auto grid gap-3 px-3 pb-7 text-sm text-[#66738c] max-[620px]:hidden"><a href="settings.html">Settings</a><a href="about.html">About</a></div>
</aside>
<div class="flex h-screen min-w-0 flex-1 flex-col max-[620px]:h-auto">
<header class="flex min-h-[76px] items-center justify-between gap-6 border-b border-[#dfe2e9] bg-[#fafbfe] px-[26px] py-[18px] max-[900px]:px-6 max-[620px]:min-h-16 max-[620px]:px-5 max-[620px]:py-2.5">
    <span class="text-sm">My workspace <span class="pl-2 text-[#67748b]">/ Calendar</span></span>
    <div class="relative">
        <button class="grid h-[34px] w-[34px] place-items-center rounded-full border-0 bg-white text-[#2f68d8] shadow-[0_2px_10px_#5c668014] focus:outline-none focus:ring-2 focus:ring-[#668cff]" id="profile-button" type="button" aria-expanded="false" aria-controls="profile-menu" aria-label="Open profile menu"><span aria-hidden="true">👤</span></button>
        <div id="profile-menu" class="absolute right-0 top-full z-10 mt-2 hidden w-56 rounded-xl border border-[#e1e4ec] bg-white p-2 shadow-[0_10px_30px_#17233b1a]">
            <p id="user-name" class="hidden w-full break-words px-3 py-2 text-xs"></p>
            <button class="block w-full border-0 bg-transparent px-3 py-2 text-left text-xs hover:bg-[#eff3ff]" id="google-sign-in" type="button">Sign in with Google</button>
            <a class="block px-3 py-2 text-xs hover:bg-[#eff3ff]" href="about.html">About</a>
            <a class="block px-3 py-2 text-xs hover:bg-[#eff3ff]" href="settings.html">Settings</a>
            <button class="hidden block w-full border-0 bg-transparent px-3 py-2 text-left text-xs hover:bg-[#eff3ff]" id="google-sign-out" type="button">Sign out</button>
        </div>
    </div>
</header>
    <main class="min-h-0 flex-1 overflow-y-auto">
        <div class="mx-auto max-w-6xl px-6 py-10">
        <section class="rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200 sm:p-8">
            <div class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
                <div>
                    <h1 class="text-3xl font-bold tracking-tight">Your Google Calendar</h1>
                    <p class="mt-2 text-slate-600">Connect your own Google account to view and create calendar events.</p>
                </div>
                <button class="rounded-lg bg-indigo-600 px-5 py-2.5 font-medium text-white hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2" id="connect-button" type="button">Connect Google Calendar</button>
            </div>
            <p class="mt-4 hidden rounded-lg bg-red-50 p-3 text-sm text-red-700" id="status" role="alert"></p>
        </section>

        <section class="mt-6 hidden rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200" id="calendar-panel">
            <div class="flex flex-col gap-4 border-b border-slate-100 pb-5 sm:flex-row sm:items-center sm:justify-between">
                <div class="flex items-center justify-between gap-4">
                    <button class="rounded-lg px-3 py-2 text-slate-600 hover:bg-slate-100" id="previous-month" type="button" aria-label="Previous month">←</button>
                    <h2 class="text-xl font-semibold" id="month-label"></h2>
                    <button class="rounded-lg px-3 py-2 text-slate-600 hover:bg-slate-100" id="next-month" type="button" aria-label="Next month">→</button>
                </div>
                <button class="text-sm font-medium text-slate-500 hover:text-indigo-600" id="sign-out-button" type="button">Sign out</button>
            </div>
            <div class="mt-5 overflow-x-auto">
                <div class="min-w-[44rem]">
                    <div class="grid grid-cols-7 text-center text-xs font-semibold uppercase tracking-wide text-slate-500">
                        <div class="p-2">Sun</div><div class="p-2">Mon</div><div class="p-2">Tue</div><div class="p-2">Wed</div><div class="p-2">Thu</div><div class="p-2">Fri</div><div class="p-2">Sat</div>
                    </div>
                    <div class="grid grid-cols-7 gap-px overflow-hidden rounded-lg bg-slate-200" id="calendar-grid"></div>
                </div>
            </div>
            <h3 class="mt-8 border-t border-slate-100 pt-6 text-lg font-semibold">Upcoming events</h3>
            <ul class="mt-4 divide-y divide-slate-100" id="event-list"></ul>

            <form class="mt-8 border-t border-slate-100 pt-6" id="event-form">
                <h2 class="text-xl font-semibold">Create an event</h2>
                <div class="mt-4 grid gap-4 sm:grid-cols-2">
                    <label class="text-sm font-medium text-slate-700 sm:col-span-2">Title
                        <input class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 font-normal outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200" id="event-title" required>
                    </label>
                    <label class="text-sm font-medium text-slate-700">Start
                        <input class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 font-normal outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200" id="event-start" type="datetime-local" required>
                    </label>
                    <label class="text-sm font-medium text-slate-700">End
                        <input class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 font-normal outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200" id="event-end" type="datetime-local" required>
                    </label>
                </div>
                <button class="mt-4 rounded-lg bg-slate-900 px-5 py-2.5 font-medium text-white hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-500 focus:ring-offset-2" type="submit">Create event</button>
            </form>
        </section>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
        import { browserLocalPersistence, getAuth, GoogleAuthProvider, onAuthStateChanged, setPersistence, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAciZ1LY9gJlXIIKEyictRZlX-fzjU6zFU",
            authDomain: "student-productivity-e14a6.firebaseapp.com",
            projectId: "student-productivity-e14a6",
            storageBucket: "student-productivity-e14a6.firebasestorage.app",
            messagingSenderId: "291163694614",
            appId: "1:291163694614:web:cc1590ca0ffcf5e2c57737"
        };

        const auth = getAuth(initializeApp(firebaseConfig));
        const accessTokenKey = "student-productivity-calendar-token";
        const provider = new GoogleAuthProvider();
        provider.addScope("https://www.googleapis.com/auth/calendar.events");
        const connectButton = document.querySelector("#connect-button");
        const signOutButton = document.querySelector("#sign-out-button");
        const calendarPanel = document.querySelector("#calendar-panel");
        const eventList = document.querySelector("#event-list");
        const eventForm = document.querySelector("#event-form");
        const status = document.querySelector("#status");
        const monthLabel = document.querySelector("#month-label");
        const calendarGrid = document.querySelector("#calendar-grid");
        let displayedMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
        let calendarEvents = [];
        let accessToken = localStorage.getItem(accessTokenKey);
        const calendarStorageKey = "student-productivity-calendar-events";

        function showError(message) {
            status.textContent = message;
            status.classList.remove("hidden");
        }

        function updateConnectionView(connected) {
            const hasLocalTasks = getLocalTaskEvents().length > 0;
            calendarPanel.classList.toggle("hidden", !connected && !hasLocalTasks);
            connectButton.classList.toggle("hidden", connected);
        }

        function getLocalTaskEvents() {
            try {
                const tasks = JSON.parse(localStorage.getItem("student-productivity-tasks") || "[]");
                return tasks.filter((task) => task.date && task.time).map((task) => ({
                    id: `local-${task.id}`,
                    taskId: task.id,
                    summary: task.title,
                    start: { dateTime: new Date(`${task.date}T${task.time}`).toISOString() },
                    localTask: true,
                    completed: task.completed
                }));
            } catch {
                return [];
            }
        }

        function formatEventDate(event) {
            if (event.start?.date) {
                const [year, month, day] = event.start.date.split("-").map(Number);
                return new Intl.DateTimeFormat(undefined, { dateStyle: "medium" }).format(new Date(year, month - 1, day));
            }
            if (event.start?.dateTime) {
                return new Intl.DateTimeFormat(undefined, { dateStyle: "medium", timeStyle: "short" }).format(new Date(event.start.dateTime));
            }
            return "Date unavailable";
        }

        function eventDateKey(event) {
            if (event.start?.date) return event.start.date;
            const date = new Date(event.start?.dateTime);
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
        }

        function dateKey(year, month, day) {
            return `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
        }

        function renderCalendar() {
            const year = displayedMonth.getFullYear();
            const month = displayedMonth.getMonth();
            monthLabel.textContent = displayedMonth.toLocaleDateString(undefined, { month: "long", year: "numeric" });
            calendarGrid.replaceChildren();
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const todayKey = dateKey(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());

            for (let index = 0; index < firstDay; index += 1) {
                const blank = document.createElement("div");
                blank.className = "min-h-28 bg-slate-50";
                calendarGrid.append(blank);
            }

            for (let day = 1; day <= daysInMonth; day += 1) {
                const key = dateKey(year, month, day);
                const cell = document.createElement("div");
                cell.className = "min-h-28 bg-white p-2";
                const number = document.createElement("div");
                number.className = `mb-2 flex h-7 w-7 items-center justify-center rounded-full text-sm ${key === todayKey ? "bg-indigo-600 font-bold text-white" : "text-slate-700"}`;
                number.textContent = day;
                cell.append(number);

                calendarEvents.filter((event) => eventDateKey(event) === key).forEach((event) => {
                    const chip = document.createElement("div");
                    chip.className = `mb-1 truncate rounded px-2 py-1 text-left text-xs font-medium ${event.localTask ? "bg-emerald-100 text-emerald-800" : "bg-indigo-100 text-indigo-800"}`;
                    chip.textContent = event.summary || "Untitled event";
                    chip.title = formatEventDate(event);
                    makeEventDraggable(chip, event);
                    cell.append(chip);
                });
                calendarGrid.append(cell);
            }
        }

        function renderEvents(events) {
            eventList.replaceChildren();
            if (!events.length) {
                const empty = document.createElement("li");
                empty.className = "py-4 text-slate-500";
                empty.textContent = "No upcoming events found.";
                eventList.append(empty);
                return;
            }
            events.forEach((event) => {
                const item = document.createElement("li");
                item.className = "py-4";
                const title = document.createElement("p");
                title.className = "font-medium";
                title.textContent = event.summary || "Untitled event";
                const date = document.createElement("p");
                date.className = "mt-1 text-sm text-slate-500";
                date.textContent = `${event.localTask ? "Task · " : ""}${formatEventDate(event)}`;
                makeEventDraggable(item, event);
                item.append(title, date);
                eventList.append(item);
            });
        }

        function makeEventDraggable(element, event) {
            element.draggable = true;
            element.classList.add("cursor-grab");
            element.addEventListener("dragstart", (dragEvent) => {
                dragEvent.dataTransfer.effectAllowed = "copy";
                dragEvent.dataTransfer.setData("application/x-productivity-calendar-event", JSON.stringify(event));
                dragEvent.dataTransfer.setData("text/plain", event.summary || "Calendar event");
                element.classList.add("opacity-50");
            });
            element.addEventListener("dragend", () => element.classList.remove("opacity-50"));
        }

        function publishCalendarEvents(events) {
            const uniqueEvents = [...new Map(events.map((event) => [event.id || `${event.summary}-${event.start?.dateTime || event.start?.date}`, event])).values()];
            localStorage.setItem(calendarStorageKey, JSON.stringify(uniqueEvents));
            window.dispatchEvent(new CustomEvent("calendar-events-updated", { detail: uniqueEvents }));
        }

        async function calendarRequest(path, options = {}) {
            const response = await fetch(`https://www.googleapis.com/calendar/v3${path}`, {
                ...options,
                headers: { Authorization: `Bearer ${accessToken}`, "Content-Type": "application/json", ...options.headers }
            });
            if (response.status === 401) {
                localStorage.removeItem(accessTokenKey);
                accessToken = null;
                updateConnectionView(false);
                throw new Error("Your Google Calendar session expired. Please reconnect.");
            }
            if (!response.ok) throw new Error(`Google Calendar request failed (${response.status}).`);
            return response.json();
        }

        async function loadEvents() {
            const start = new Date(displayedMonth);
            const end = new Date(displayedMonth.getFullYear(), displayedMonth.getMonth() + 1, 1);
            const params = new URLSearchParams({ maxResults: "250", orderBy: "startTime", singleEvents: "true", timeMin: start.toISOString(), timeMax: end.toISOString() });
            const data = await calendarRequest(`/calendars/primary/events?${params}`);
            calendarEvents = [...(data.items || []), ...getLocalTaskEvents()];
            publishCalendarEvents(calendarEvents);
            renderCalendar();
            renderEvents(calendarEvents);
        }

        function renderLocalCalendar() {
            if (accessToken) {
                loadEvents().catch((error) => showError(error.message));
                return;
            }
            calendarEvents = getLocalTaskEvents();
            publishCalendarEvents(calendarEvents);
            renderCalendar();
            renderEvents(calendarEvents);
            updateConnectionView(Boolean(accessToken));
        }

        connectButton.addEventListener("click", async () => {
            status.classList.add("hidden");
            try {
                await setPersistence(auth, browserLocalPersistence);
                const result = await signInWithPopup(auth, provider);
                accessToken = GoogleAuthProvider.credentialFromResult(result)?.accessToken || null;
                if (!accessToken) throw new Error("Google did not return a Calendar access token.");
                localStorage.setItem(accessTokenKey, accessToken);
                updateConnectionView(true);
                await loadEvents();
            } catch (error) {
                showError(error.message);
            }
        });

        signOutButton.addEventListener("click", async () => {
            accessToken = null;
            localStorage.removeItem(accessTokenKey);
            updateConnectionView(false);
            await signOut(auth);
        });

        document.querySelector("#previous-month").addEventListener("click", async () => {
            displayedMonth.setMonth(displayedMonth.getMonth() - 1);
            renderCalendar();
            if (accessToken) await loadEvents();
        });

        document.querySelector("#next-month").addEventListener("click", async () => {
            displayedMonth.setMonth(displayedMonth.getMonth() + 1);
            renderCalendar();
            if (accessToken) await loadEvents();
        });

        eventForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            try {
                await calendarRequest("/calendars/primary/events", {
                    method: "POST",
                    body: JSON.stringify({
                        summary: document.querySelector("#event-title").value,
                        start: { dateTime: new Date(document.querySelector("#event-start").value).toISOString() },
                        end: { dateTime: new Date(document.querySelector("#event-end").value).toISOString() }
                    })
                });
                eventForm.reset();
                await loadEvents();
            } catch (error) {
                showError(error.message);
            }
        });

        setPersistence(auth, browserLocalPersistence).catch((error) => showError(error.message));

        window.addEventListener("storage", renderLocalCalendar);
        window.addEventListener("tasks-updated", renderLocalCalendar);
        renderLocalCalendar();

        onAuthStateChanged(auth, async (user) => {
            const connected = Boolean(user && accessToken);
            updateConnectionView(connected);
            if (connected) {
                try {
                    await loadEvents();
                } catch (error) {
                    showError(error.message);
                }
            }
        });
    </script>
</body>
</html>
