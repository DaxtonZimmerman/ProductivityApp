<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes</title>


    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/notes.js" defer></script>


</head>
<body class="h-screen overflow-hidden bg-slate-100 text-slate-900">

<div class="flex h-screen min-h-0 w-full">
<aside id="notes-sidebar" class="relative z-10 flex h-full w-16 shrink-0 flex-col overflow-hidden rounded-br-[25px] bg-white p-3 text-slate-600 shadow-sm transition-[width,padding] duration-300" aria-label="Notes sidebar">
    <a class="sidebar-label hidden mb-8 flex shrink-0 items-center gap-3 whitespace-nowrap px-2 text-lg font-bold tracking-tight text-slate-900" href="index.html"><span class="flex h-9 w-9 items-center justify-center rounded-xl bg-indigo-600 text-lg text-white" aria-hidden="true">S</span><span>Student <span class="text-indigo-600">Productivity</span></span></a>
    <p class="sidebar-label hidden mb-2 whitespace-nowrap px-2 text-[10px] font-bold uppercase tracking-[0.2em] text-slate-400">Workspace</p>
    <nav class="sidebar-label hidden flex shrink-0 flex-col gap-1 whitespace-nowrap" aria-label="Main navigation">
        <a class="rounded-xl px-3 py-2.5 text-sm font-semibold text-slate-600 hover:bg-slate-100 hover:text-indigo-700" href="index.html">Dashboard</a>
        <a class="rounded-xl px-3 py-2.5 text-sm font-semibold text-slate-600 hover:bg-slate-100 hover:text-indigo-700" href="tasks.html">Tasks</a>
        <a class="rounded-xl px-3 py-2.5 text-sm font-semibold text-slate-600 hover:bg-slate-100 hover:text-indigo-700" href="calendar.html">Calendar</a>
        <a class="rounded-xl bg-indigo-50 px-3 py-2.5 text-sm font-semibold text-indigo-700" aria-current="page" href="notes.html">Notes</a>
    </nav>
    <div class="sidebar-label mt-auto hidden shrink-0 border-t border-slate-200 pt-4"><a class="block px-2 py-2 text-sm font-semibold hover:text-indigo-700" href="settings.html">Settings</a><a class="block px-2 py-2 text-sm font-semibold hover:text-indigo-700" href="about.html">About</a></div>
    <div id="sidebar-actions" class="mt-5 flex min-h-0 flex-1 flex-col items-center gap-3 border-t border-slate-200 pt-5 opacity-0 transition-opacity duration-200" aria-hidden="true">
        <button id="add-note" class="flex w-full shrink-0 items-center justify-center gap-3 rounded-xl border border-transparent px-2 py-3 text-2xl font-light text-slate-700 hover:border-indigo-100 hover:bg-indigo-50 hover:text-indigo-700" type="button" title="Create a note"><span aria-hidden="true">+</span><span class="sidebar-label hidden text-sm font-semibold">New note</span></button>
        <button id="delete-note" class="flex w-full shrink-0 items-center justify-center gap-3 rounded-xl border border-transparent px-2 py-3 text-xl text-slate-700 hover:border-rose-100 hover:bg-rose-50 hover:text-rose-700" type="button" title="Delete selected note"><span aria-hidden="true">🗑</span><span class="sidebar-label hidden text-sm font-semibold">Delete selected</span></button>
        <button id="organize-notes" class="flex w-full shrink-0 items-center justify-center gap-3 rounded-xl border border-transparent px-2 py-3 text-xl text-slate-700 hover:border-emerald-100 hover:bg-emerald-50 hover:text-emerald-700" type="button" title="Organize notes into a grid"><span aria-hidden="true">▦</span><span class="sidebar-label hidden text-sm font-semibold">Organize</span></button>
        <div id="task-dock" class="mt-3 min-h-0 w-full overflow-y-auto border-t border-slate-200 pt-4"><div class="flex items-center justify-between gap-2 px-2"><span class="sidebar-label hidden text-xs font-bold uppercase tracking-widest text-slate-500">Tasks</span><a class="sidebar-label hidden text-xs font-semibold text-indigo-600" href="tasks.html">Manage</a></div><div id="sidebar-task-list" class="mt-2 max-h-56 space-y-2 overflow-y-auto px-1" aria-label="Draggable tasks"><p class="sidebar-label hidden px-2 py-2 text-xs text-slate-400">No tasks yet.</p></div><div class="mt-4 border-t border-slate-200 pt-4"><div class="flex items-center justify-between gap-2 px-2"><span class="sidebar-label hidden text-xs font-bold uppercase tracking-widest text-slate-500">Calendar</span><a class="sidebar-label hidden text-xs font-semibold text-indigo-600" href="calendar.html">Open</a></div><div id="sidebar-event-list" class="mt-2 max-h-56 space-y-2 overflow-y-auto px-1" aria-label="Draggable calendar events"><p class="sidebar-label hidden px-2 py-2 text-xs text-slate-400">No calendar events yet.</p></div></div></div>
    </div>
    <button id="sidebar-toggle" class="absolute right-2 top-4 flex h-8 w-8 items-center justify-center rounded-full border border-slate-200 bg-white text-lg leading-none text-slate-600 shadow-sm transition hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500" type="button" aria-controls="notes-sidebar" aria-expanded="false" aria-label="Open notes sidebar"><span aria-hidden="true">→</span></button>
</aside>
<div class="flex min-w-0 min-h-0 flex-1 flex-col">
<header class="flex h-16 shrink-0 items-center justify-between border-b border-slate-200 bg-white px-5 sm:px-8">
    <span class="text-sm font-semibold text-slate-700">My workspace <span class="font-normal text-slate-400">/ Notes</span></span>
    <div class="relative">
        <button id="profile-button" class="flex h-9 w-9 items-center justify-center rounded-full bg-slate-100 text-base hover:bg-indigo-50 focus:outline-none focus:ring-2 focus:ring-indigo-500" type="button" aria-expanded="false" aria-controls="profile-menu" aria-label="Open profile menu"><span aria-hidden="true">👤</span></button>
        <div id="profile-menu" class="absolute right-0 top-11 z-30 hidden w-48 rounded-xl border border-slate-200 bg-white p-2 text-sm shadow-lg">
            <p id="user-name" class="hidden border-b border-slate-100 px-3 py-2 text-xs font-semibold text-slate-500"></p>
            <button id="google-sign-in" class="w-full rounded-lg px-3 py-2 text-left hover:bg-slate-100" type="button">Sign in with Google</button>
            <a class="block rounded-lg px-3 py-2 hover:bg-slate-100" href="about.html">About</a>
            <a class="block rounded-lg px-3 py-2 hover:bg-slate-100" href="settings.html">Settings</a>
            <button id="google-sign-out" class="hidden w-full rounded-lg px-3 py-2 text-left hover:bg-slate-100" type="button">Sign out</button>
        </div>
    </div>
</header>
    <section class="flex min-h-0 flex-1 bg-slate-100">
        <main class="min-w-0 flex-1 p-4 sm:p-6">
            <div class="flex h-full min-h-0 flex-col overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-sm">
                <div class="flex shrink-0 items-center justify-between border-b border-slate-200 px-5 py-4 sm:px-6">
                    <div>
                        <p class="text-xs font-bold uppercase tracking-[0.2em] text-indigo-600">Notes</p>
                        <h1 class="mt-1 text-xl font-bold tracking-tight text-slate-900">Your thought space</h1>
                    </div>
                    <p id="note-status" class="text-right text-xs font-medium text-slate-400">0 notes</p>
                </div>
                <div id="notes-canvas" class="relative min-h-0 flex-1 overflow-auto bg-slate-50 [background-image:radial-gradient(#cbd5e1_1px,transparent_1px)] [background-size:24px_24px]" tabindex="0" aria-label="Notes canvas">
                    <div id="empty-state" class="absolute inset-0 flex items-center justify-center p-8 text-center text-slate-400">
                        <div>
                            <div class="mx-auto mb-3 flex h-14 w-14 items-center justify-center rounded-2xl bg-indigo-100 text-3xl text-indigo-600">+</div>
                            <p class="font-semibold text-slate-600">Your canvas is clear</p>
                            <p class="mt-1 text-sm">Open the sidebar and create a note to begin.</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>

    </section>

    

</body>
</html>
