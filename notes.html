<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes</title>


    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/notes.js" defer></script>


</head>
<body class="flex h-screen flex-col overflow-hidden bg-slate-100 text-slate-900">

    <header class="shrink-0 border-b border-slate-200 bg-white">

        <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-5">
            <h1 class="text-2xl font-bold tracking-tight">Student Productivity</h1>
            <nav class="flex flex-wrap gap-4 text-sm font-medium text-slate-600" aria-label="Main navigation">
                <a class="text-slate-600 hover:text-indigo-600" href="index.html">Workspace</a>
                <a class="text-slate-600 hover:text-indigo-600" href="#tasks">Tasks</a>
                <a class="text-slate-600 hover:text-indigo-600" href="Focus.html">Focus</a>
                <a class="text-slate-600 hover:text-indigo-600" href="calendar.html">Calendar</a>
                <a class="text-slate-600 hover:text-indigo-600" href="notes.html">Notes</a>
            </nav>
        </div>
    </header>
    
    <section class="flex min-h-0 flex-1 bg-slate-100">
        <aside id="notes-sidebar" class="relative z-10 h-full w-16 shrink-0 rounded-r-[25px] bg-white p-3 text-slate-600 shadow-sm transition-[width] duration-300" aria-label="Notes sidebar">
            <button id="sidebar-toggle" class="absolute right-2 top-4 flex h-8 w-8 items-center justify-center rounded-full border border-slate-200 bg-white text-lg leading-none text-slate-600 shadow-sm transition hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500" type="button" aria-controls="notes-sidebar" aria-expanded="false" aria-label="Open notes sidebar">
                <span aria-hidden="true">→</span>
            </button>

            <div id="sidebar-actions" class="mt-16 flex flex-col items-center gap-3 opacity-0 transition-opacity duration-200" aria-hidden="true">
                <button id="add-note" class="group flex w-full items-center justify-center gap-3 rounded-xl border border-transparent px-2 py-3 text-left text-2xl font-light text-slate-700 transition hover:border-indigo-100 hover:bg-indigo-50 hover:text-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500" type="button" title="Create a note">
                    <span aria-hidden="true">+</span><span class="sidebar-label hidden text-sm font-semibold">New note</span>
                </button>
                <button id="delete-note" class="group flex w-full items-center justify-center gap-3 rounded-xl border border-transparent px-2 py-3 text-left text-xl text-slate-700 transition hover:border-rose-100 hover:bg-rose-50 hover:text-rose-700 focus:outline-none focus:ring-2 focus:ring-rose-500" type="button" title="Delete selected note">
                    <span aria-hidden="true">🗑</span><span class="sidebar-label hidden text-sm font-semibold">Delete selected</span>
                </button>
                <button id="organize-notes" class="group flex w-full items-center justify-center gap-3 rounded-xl border border-transparent px-2 py-3 text-left text-xl text-slate-700 transition hover:border-emerald-100 hover:bg-emerald-50 hover:text-emerald-700 focus:outline-none focus:ring-2 focus:ring-emerald-500" type="button" title="Organize notes into a grid">
                    <span aria-hidden="true">▦</span><span class="sidebar-label hidden text-sm font-semibold">Organize</span>
                </button>
            </div>
        </aside>

        <main class="min-w-0 flex-1 p-4 sm:p-6">
            <div class="flex h-full min-h-0 flex-col overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-sm">
                <div class="flex shrink-0 items-center justify-between border-b border-slate-200 px-5 py-4 sm:px-6">
                    <div>
                        <p class="text-xs font-bold uppercase tracking-[0.2em] text-indigo-600">Notes</p>
                        <h2 class="mt-1 text-xl font-bold tracking-tight text-slate-900">Your thought space</h2>
                    </div>
                    <p id="note-status" class="text-right text-xs font-medium text-slate-400">0 notes</p>
                </div>
                <div id="notes-canvas" class="relative min-h-0 flex-1 overflow-auto bg-slate-50 [background-image:radial-gradient(#cbd5e1_1px,transparent_1px)] [background-size:24px_24px]" tabindex="0" aria-label="Notes canvas">
                    <div id="empty-state" class="absolute inset-0 flex items-center justify-center p-8 text-center text-slate-400">
                        <div>
                            <div class="mx-auto mb-3 flex h-14 w-14 items-center justify-center rounded-2xl bg-indigo-100 text-3xl text-indigo-600">+</div>
                            <p class="font-semibold text-slate-600">Your canvas is clear</p>
                            <p class="mt-1 text-sm">Open the sidebar and create a note to begin.</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>

    </section>

    
</body>
</html>
