<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | Student Productivity</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
    <main class="mx-auto max-w-3xl px-6 py-10">
        <nav class="mb-6 flex flex-wrap gap-4 text-sm font-medium text-slate-600" aria-label="Main navigation">
            <a class="hover:text-indigo-600" href="index.html">Dashboard</a>
            <a class="hover:text-indigo-600" href="tasks.html">Tasks</a>
            <a class="hover:text-indigo-600" href="calendar.html">Calendar</a>
            <a class="hover:text-indigo-600" href="notes.html">Notes</a>
            <a class="text-indigo-600" href="settings.html" aria-current="page">Settings</a>
            <a class="hover:text-indigo-600" href="about.html">About</a>
        </nav>
        <a class="text-sm font-medium text-indigo-600 hover:text-indigo-800" href="index.html">← Back to workspace</a>
        <section class="mt-6 rounded-2xl bg-white p-8 shadow-sm ring-1 ring-slate-200">
            <h1 class="text-3xl font-bold">Settings</h1>
            <p class="mt-3 text-slate-600">Manage local data saved by this browser.</p>
            <button class="mt-6 rounded-lg bg-red-600 px-5 py-2.5 font-medium text-white hover:bg-red-700" id="clear-data" type="button">Clear tasks and notes</button>
            <p class="mt-3 hidden text-sm text-green-700" id="clear-status">Local tasks and notes were cleared.</p>
        </section>
    </main>
    <script>
        document.querySelector("#clear-data").addEventListener("click", () => {
            localStorage.removeItem("student-productivity-tasks");
            localStorage.removeItem("student-productivity-notes");
            document.querySelector("#clear-status").classList.remove("hidden");
        });
    </script>
</body>
</html>
